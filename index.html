    <script>
      // 1. Patch HTMLCanvasElement.prototype.getContext for willReadFrequently: true
      // Eliminates the 1000+ repetitive Chrome DevTools readback warnings emitted by face-api.js & TensorFlow
      (function() {
        var origGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attributes) {
          if (type === '2d') {
            attributes = Object.assign({ willReadFrequently: true }, attributes);
          }
          return origGetContext.call(this, type, attributes);
        };
      })();

      try {
        var saved = localStorage.getItem('app_theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && systemDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <script>
      // Immediately purge all legacy Service Worker caches across all environments to guarantee fresh UI & assets
      if (window.caches) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    </script>
